<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>US Donovan Coin</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:620px;margin:60px auto;padding:20px;text-align:center}
    img{width:160px;height:160px;border-radius:50%}
    button{font-size:18px;padding:14px 22px;border:0;border-radius:10px;cursor:pointer}
    code{word-break:break-all}
  </style>
</head>
<body>
  <img src="./logo.png" alt="US Donovan Coin logo">
  <h1>US Donovan Coin</h1>
  <p>Personal/test ERC-20 token on Polygon.</p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
  <button id="add">Add USDC to MetaMask</button>
  <button id="rabby" style="background:#6c5ce7;color:white">Add USDC to Rabby</button>
</div>
  <p><small>Contract: <code>0xb5406f7315737E36C0b719695bFDD3bF4CA499cB</code></small></p>

<script>
document.getElementById("add").onclick = async () => {
  if (!window.ethereum) {
    alert("Please open this page in a browser with MetaMask installed.");
    return;
  }
  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x89" }]
    });
  } catch (e) {
    // If Polygon is not already configured, MetaMask may reject the switch.
  }

  try {
    const added = await window.ethereum.request({
      method: "wallet_watchAsset",
      params: {
        type: "ERC20",
        options: {
          address: "0xb5406f7315737E36C0b719695bFDD3bF4CA499cB",
          symbol: "USDC",
          decimals: 6,
          image: new URL("./logo.png", window.location.href).href
        }
      }
    });
    if (added) alert("US Donovan Coin was added to MetaMask.");
  } catch (e) {
    console.error(e);
    alert("MetaMask did not add the token. Make sure you are on Polygon.");
  }
};

document.getElementById("rabby").onclick = async () => {
  // Rabby exposes an EIP-1193 provider and identifies itself with isRabby.
  // If multiple wallets are installed, prefer the Rabby provider announced by EIP-6963.
  let rabbyProvider = null;

  if (window.ethereum && window.ethereum.isRabby) {
    rabbyProvider = window.ethereum;
  } else {
    const providers = window.ethereum?.providers || [];
    rabbyProvider = providers.find(p => p.isRabby) || null;
  }

  if (!rabbyProvider) {
    alert("Rabby Wallet was not detected. Install Rabby and open this page in the same browser.");
    return;
  }

  try {
    await rabbyProvider.request({ method: "eth_requestAccounts" });

    // Ask Rabby to switch to Polygon if it is already configured.
    try {
      await rabbyProvider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x89" }]
      });
    } catch (switchError) {
      // User can switch to Polygon manually if Rabby does not allow the request.
      console.log("Please switch Rabby to Polygon manually.", switchError);
    }

    // EIP-747. Rabby exposes an EIP-1193 provider and may support this method.
    // If unsupported, the user can import the contract manually in Rabby.
    await rabbyProvider.request({
      method: "wallet_watchAsset",
      params: {
        type: "ERC20",
        options: {
          address: "0xb5406f7315737E36C0b719695bFDD3bF4CA499cB",
          symbol: "USDC",
          decimals: 6,
          image: new URL("./logo.png", window.location.href).href
        }
      }
    });
  } catch (e) {
    console.error(e);
    alert("Rabby did not accept the automatic import. Open Rabby on Polygon and add the custom token using the contract address shown below.");
  }
};

</script>
</body>
</html>
